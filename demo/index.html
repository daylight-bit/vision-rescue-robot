<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉引导控制台</title><style>body{margin:0;background:#0b1220;color:#e8f0f7;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:980px;margin:36px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26364b;padding-bottom:18px}h1{font-size:32px;margin:0;color:#fff}.sub{color:#8fa9bf}.card{background:#121f30;border:1px solid #294059;border-radius:14px;padding:22px;margin-top:20px}button,select,input{background:#1d344b;color:#eef;border:1px solid #3c6682;border-radius:8px;padding:10px 14px;font-size:15px}button{cursor:pointer;background:#168c87;border-color:#2bbeb3}button:hover{filter:brightness(1.15)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#10263a;padding:14px;border-radius:10px}.metric b{display:block;font-size:25px;color:#4de0cc;margin-top:5px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{padding:10px 12px;border-radius:8px;background:#203349;color:#aac2d4}.step.on{background:#168c87;color:#fff}.log{min-height:80px;color:#a9c8d7;white-space:pre-line}@media(max-width:680px){.grid{grid-template-columns:1fr}h1{font-size:25px}}</style><main><div class="top"><div><h1>视觉引导控制台</h1><div class="sub">控制链路实验 · 虚拟输入</div></div><span>任务：<b id="state">搜索目标</b></span></div><section class="card"><h2>目标横向位置</h2><input id="x" type="range" min="0" max="100" value="35" oninput="update()"><p>目标中心：<b id="val">35</b> / 画面中心：50</p><div class="steps"><div class="step on" id="a">检测目标</div><div class="step" id="b">提取中心</div><div class="step" id="c">调整方向</div><div class="step" id="d">接近目标</div></div><div class="grid"><div class="metric">横向偏差<b id="err">-15</b></div><div class="metric">动作建议<b id="act">左转</b></div><div class="metric">控制策略<b>阈值分段</b></div></div><div class="log" id="log">拖动滑块观察像素坐标如何影响动作建议。此处不代表实车输出。</div></section><script>function update(){let x=+document.getElementById('x').value,e=x-50,act=Math.abs(e)<8?'保持':e<0?'左转':'右转';document.getElementById('val').textContent=x;document.getElementById('err').textContent=e;document.getElementById('act').textContent=act;document.getElementById('state').textContent=Math.abs(e)<8?'对齐目标':'调整方向';document.getElementById('log').textContent='根据横向偏差给出分段动作建议；纵坐标和编码器需另行验证。'}</script></main></html>
